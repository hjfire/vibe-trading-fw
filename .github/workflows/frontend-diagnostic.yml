# Temporary diagnostic for the `frontend` leg of CI, added 2026-10-25.
#
# Why it exists: the `frontend` leg reported `failure` on two consecutive pushes
# (`e55e9fde`, `00699ba8`) while the same tree stayed green in four local
# full-suite runs, and the job log is not anonymously readable
# (`/actions/jobs/<id>/logs` answers 403; the web-UI log endpoints answer 404 or
# never complete the connection). No failing test name had reached this side.
#
# Revision 2, because the first instrumented run answered two questions:
#   1. `$GITHUB_STEP_SUMMARY` is NOT anonymously readable either — the same
#      `/repos/<owner>/<repo>/check-runs/<id>` GET that returns annotations
#      reports `output.summary` of length 0. So revision 1 proved the run
#      outcome but the names it collected stayed in the web UI.
#   2. That run — same tree, same runner image, same three commands — was
#      GREEN: `Frontend tests (captured)` 184 s vs the red leg's 178 s. Nearly
#      equal durations mean the red leg ran to completion and then reported a
#      failure, so this is a flake, not a timeout, and not a Linux-only assert.
#
# Check-run ANNOTATIONS are the surface that is readable without a token (proved
# on this very check run: `GET /check-runs/<id>/annotations` answered 200). So
# the outcome, the aggregate counts and the failing test names are now emitted as
# `::notice::` workflow commands, one line each.
#
# Revision 3: the leg runs the suite THREE times inside one job. Reason — a
# single green only proves that run didn't hit it, while one job that comes back
# red-once-green-twice is itself the proof of non-determinism, and the names come
# from the round that failed. Budget: 3 x ~184 s + install ~40 s ≈ 10 min against
# this job's 20 min. The test step always exits 0 so all three rounds and the
# reporting step run whatever a round does.
#
# Parity note: `test.yml` sets NPM_CONFIG_AUDIT/FUND=false at workflow level;
# revision 1 did not, so its `npm ci` did audit. Those two runs took 34 s and
# 35 s, and audit does not change the installed tree, but the env is now copied
# so this file is a true clone of the leg.
#
# It changes nothing about the `CI` workflow and holds no write permissions.
# The trigger names only the slice branch that carries this file, so the
# diagnostic never runs against `main`. Delete this file once the red is
# attributed.
name: frontend-diagnostic
on:
  push:
    branches: [feat/l3-slice6-interval-catalogue-l0]
permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  frontend-diagnostic:
    name: frontend diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build (clone of the CI leg)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Frontend tests, three rounds (captured)
        shell: bash
        run: |
          cd frontend
          for round in 1 2 3; do
            set -o pipefail
            npx vitest run --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/vitest-r$round.log"
            rc=$?
            printf '%s\n' "$rc" > "$RUNNER_TEMP/vitest-r$round-rc"
            echo "round $round rc=$rc"
          done
          true

      - name: Outcome as annotations (anonymously readable)
        if: '!cancelled()'
        shell: bash
        run: |
          emit() {
            # $1 title, $2 message — both forced to one line and percent-escaped
            local t m
            t=$(printf '%s' "$1" | tr -d '\r\n' | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g')
            m=$(printf '%s' "$2" | tr -d '\r\n' | sed -e 's/%/%25/g' | cut -c1-200)
            printf '::notice file=.github/workflows/frontend-diagnostic.yml,title=%s::%s\n' "$t" "$m"
          }

          strip() { sed -e 's/\x1b\[[0-9;]*m//g'; }

          ver() { sed -n 's/.*"version": "\([^"]*\)".*/\1/p' "frontend/node_modules/$1/package.json" | head -1; }

          emit coordinates "node=$(node -v) v8=$(node -p 'process.versions.v8') icu=$(node -p 'process.versions.icu') tz=$(node -p 'process.versions.tz') openssl=$(node -p 'process.versions.openssl')"
          emit host "nproc=$(nproc) mem=$(awk '/MemTotal/{print $2}' /proc/meminfo) kB load=$(cut -d' ' -f1-3 /proc/loadavg)"
          emit stack "vitest=$(ver vitest) vite=$(ver vite) jsdom=$(ver jsdom)"

          for round in 1 2 3; do
            log="$RUNNER_TEMP/vitest-r$round.log"
            if [ ! -f "$log" ]; then
              emit "round$round" "no log — a step before this round died"
              continue
            fi
            rc=$(cat "$RUNNER_TEMP/vitest-r$round-rc" 2>/dev/null || echo unknown)
            emit "round$round" "rc=$rc bytes=$(wc -c < "$log") $(strip < "$log" | grep -E 'Test Files|      Tests' | tr -s ' ' | tr '\n' '|')"
            if [ "$rc" != "0" ]; then
              strip < "$log" \
                | grep -nE "^[[:space:]]*(FAIL|×|✕|→)|Error:|timed out|Unhandled|Cannot find|failed to load" \
                | head -10 \
                | while IFS= read -r line; do emit "failing-r$round" "$line"; done
            fi
          done

      - name: Same content in the job summary
        if: '!cancelled()'
        shell: bash
        run: |
          {
            echo "## frontend-diagnostic (three rounds)"
            echo "- node: $(node -v)  icu: $(node -p 'process.versions.icu')  tz: $(node -p 'process.versions.tz')"
            echo "- nproc: $(nproc)  mem: $(awk '/MemTotal/{print $2}' /proc/meminfo) kB  os: $(. /etc/os-release && echo "$PRETTY_NAME $VERSION_CODENAME")"
            echo "- vitest: $(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' frontend/node_modules/vitest/package.json | head -1)  vite: $(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' frontend/node_modules/vite/package.json | head -1)  jsdom: $(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' frontend/node_modules/jsdom/package.json | head -1)"
            for round in 1 2 3; do
              log="$RUNNER_TEMP/vitest-r$round.log"
              echo
              echo "### round $round — rc=$(cat "$RUNNER_TEMP/vitest-r$round-rc" 2>/dev/null || echo unknown)"
              [ -f "$log" ] || { echo "no log"; continue; }
              echo '```text'
              sed -e 's/\x1b\[[0-9;]*m//g' "$log" \
                | grep -nE "^[[:space:]]*(FAIL|×|✕|→)|Error:|timed out|Unhandled|(Test Files|      Tests|   Duration)" | head -60
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
