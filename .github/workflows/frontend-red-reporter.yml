# Post-hoc attribution for the `CI` workflow's legs, added 2026-10-26.
#
# Why this exists and the previous instrument did not: the `frontend` leg goes
# red and green on BYTE-IDENTICAL trees. Tree 4e58342c691a0924b59a400e90a99c4f49214c3b
# is the `frontend` subtree of e55e9fde / 00699ba8 / b12d556d / f61153b9, and that
# one tree has produced red on runs 40172858724 and 40176155310 and green on runs
# 40184113344 and 40205498081. So the question is not "is this a regression" (it
# is not) but "which test flips" — and the failing test NAME never reached this
# side: `/actions/jobs/<id>/logs` answers 403 anonymously, the rendered job page
# never fills its log panel without a session, and `$GITHUB_STEP_SUMMARY` reads
# back as length 0. The anonymous check-run annotation surface does answer 200,
# but on those red legs it carried only "Process completed with exit code 1".
#
# What this file does instead: it reproduces nothing. It fires AFTER a `CI` run
# completes, holds a job token with `actions: read`, downloads the log of each
# failed job through the authenticated endpoint — the channel a token can open
# and a bare IP address cannot — and re-emits the failure lines as check-run
# annotations, which ARE anonymously readable. The next red `CI` run names its
# own failing tests without anyone logging in. Whether the token really can read
# those logs is reported by this job's own `log-http` annotation, not assumed.
#
# `workflow_run` only executes the copy of this file on the default branch, and
# only after the watched workflow completes. Read-only permissions, and
# `.github/workflows/test.yml` (upstream-owned, protected by the ownership gate
# in tools/test_wiki_drift.py) stays byte-for-byte untouched.
#
# What run 7 of this workflow taught us, added 2026-10-28: it died with "Process
# completed with exit code 1" on a run whose two red legs were `test / Python
# 3.11` and `test / Python 3.14`, and it named nothing. Three faults. The flag
# fault is a CONJUNCTION, which a four-regime matrix over the pre-fix body
# settled — same harness, same real two-leg job list, same real 3.3 MB pytest
# log, only the runner flags varying, and each arm reads its own regime back out
# of the summary line (a `${VAR:-}` style default would otherwise have silently
# turned the no-flags arm into the full-flag arm and made -e look fatal alone):
#   1. `shell: bash` reaches the script already carrying -e AND -o pipefail. A
#      grep that matches nothing returns 1, pipefail promotes that to a pipeline
#      failure, and -e makes a failed pipeline fatal — so a zero-match bucket was
#      a crash, not a reading. Neither flag alone kills: `-e` only and
#      `pipefail` only both returned rc=0 with naming buckets present; only the
#      pair reproduced run 7 line for line (run, failed-job, log-http, then
#      silence, rc=1, ONE failed-job annotation for a run that had two).
#   2. both extraction regexes were vitest-shaped. pytest prints `FAILED f.py::t`
#      and a `86 failed, 21744 passed ... in 1591.08s` tally; neither pattern
#      matched, so even a surviving run would have named zero tests.
# A third fault surfaced while verifying the fix, against the real 3.3 MB log of the
# merged tree's own test run: a single broad FAIL|ERROR bucket is also wrong, because
# pytest's `___ ERROR collecting x.py ___` section headers sit at the TOP of the file and
# filled all 12 slots, crowding out the 86 test names in the summary at the bottom.
# Names and reasons are therefore separate buckets now, names first.
#
# Which line carries which fault, by mutation of the FIXED body rather than by
# assertion: moving the greps into process substitutions is what removes the crash path.
# On a well-formed jobs payload, deleting `set +e`, deleting `set +o pipefail`, deleting
# both, or deleting neither all return rc=0 with the same per-job 1 aggregate / 12 names /
# 2 reasons / 1 tail — so the naming fix is not the flags' credit, and an earlier draft of
# this header, which said it was, died to exactly that mutation. The flags earn their place
# one layer up, on the payload path: when the jobs json stops parsing (a rate-limited HTML
# error page looks exactly like that to jq), the unguarded `n=$(jq ...)` assignment is
# fatal under -e, and only `set +e` prevents it — drop that line and the job dies after the
# `run` annotation; keep it and the reporter lives long enough to say `no-failed-job`.
# `set +o pipefail` is redundant the moment `set +e` is present, and stays because every
# pipeline added to this file later would otherwise have to remember its own `|| true`.
# Both are fixed below, and "this log has no lines of that shape" is now reported
# by the `census` annotation instead of by the job's own red cross.
name: frontend-red-reporter
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  report:
    name: name the failing tests
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      API: https://api.github.com/repos/${{ github.repository }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download each failed job's log and annotate the failure lines
        shell: bash
        run: |
          set -u
          # Explicit, because the runner does not ask: `shell: bash` reaches this script
          # already carrying -e AND -o pipefail, and it is that pair — not either flag
          # alone — that used to turn a zero-match grep into a dead reporter (header,
          # fault 1). A read-only reporter has no command whose failure should end the
          # report, so both come back off here rather than being tiptoed around in every
          # pipeline below. `set +e` is the line with the proof: with a jobs payload that
          # stops parsing, removing only it brings the job back down to rc=1 right after
          # the `run` annotation, at the one assignment below that has no `||` guard.
          set +e
          set +o pipefail
          auth="Authorization: Bearer $TOKEN"

          # Workflow-command escaping has two tiers: % , CR and LF are special in
          # both the data and the properties; , and : are additional property
          # separators. Titles are properties, messages are data — so the title
          # gets the wider map. Newlines are dropped rather than escaped because
          # annotations are one line each by design.
          emit() {
            local t m
            t=$(printf '%s' "$1" | tr -d '\r\n' \
                | sed -e 's/%/%25/g' -e 's/,/%2C/g' -e 's/:/%3A/g')
            m=$(printf '%s' "$2" | tr -d '\r\n' | sed -e 's/%/%25/g' | cut -c1-240)
            printf '::notice title=%s::%s\n' "$t" "$m"
          }

          strip() { sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r//g'; }

          # Counted loops, not `grep | head | while`: `head` closes the pipe after its
          # share, grep then dies of SIGPIPE (141), and the old `| while` form ran emit
          # in a subshell so the count could not be reported back. `|| true` is the point
          # — a bucket that finds nothing is a reading, not a crash.
          emit_grep() {
            local title="$1" limit="$2" src="$3" re="$4" n=0 l
            while IFS= read -r l; do
              [ "$n" -ge "$limit" ] && break
              emit "$title" "$l"
              n=$((n + 1))
            done < <(strip < "$src" | grep -aE "$re" || true)
            census="$census $title=$n"
          }

          emit_tail() {
            local title="$1" limit="$2" src="$3" n=0 l
            while IFS= read -r l; do
              emit "$title" "$l"
              n=$((n + 1))
            done < <(strip < "$src" | tail -n "$limit" || true)
            census="$census $title=$n"
          }

          # Two runners, two shapes, and nothing anchors at start-of-line because every
          # line of a downloaded Actions log carries an ISO timestamp prefix. vitest
          # prints `FAIL src/x.test.ts > case` and a `Test Files  1 failed | 122 passed`
          # pair; pytest prints `FAILED agent/tests/x.py::case - AssertionError` plus one
          # `86 failed, 21744 passed, 197 skipped in 1591.08s` tally (the short summary is
          # on by default, -r fE, so CI needs no flag for these lines to exist).
          AGG_RE='(Test Files|Tests)[[:space:]]+[0-9]+ (failed|passed)|[0-9]+ (failed|errors?)([,:]| in )|no tests ran'
          # Names and reasons are SEPARATE buckets, because one bucket got them both
          # wrong: on the 2026-10-28 merged-tree log the first 12 lines matching a broad
          # FAIL|ERROR pattern were pytest's own `___ ERROR collecting x.py ___` section
          # headers, which sit at the top of the file, so the 86 actual test names in the
          # short summary at the bottom never reached an annotation. NAMES is the payload;
          # WHY is allowed to be pushed out of the way. The bare `FAIL` alternative has no
          # trailing requirement on purpose — the first draft asked for a `>` after the
          # file token, which vitest puts after a space, and only the per-case lines
          # matched while the per-file FAIL line vanished.
          NAMES_RE='(^|[[:space:]])FAILED[[:space:]]+[^[:space:]]+::|(^|[[:space:]])FAIL[[:space:]]+|×[[:space:]]+[^[:space:]]'
          WHY_RE='Test timed out|Unhandled|worker exited|Channel closed|[Ee]rror collecting|[Ee]rror at (setup|teardown)'

          emit "run" "run=$RUN_ID conclusion=$CONCLUSION"

          # One page holds a run this size, but do not assume it.
          page=1
          failed=""
          while :; do
            if ! curl -sS -f -H "$auth" -H "Accept: application/vnd.github+json" \
               -o "$RUNNER_TEMP/jobs-p$page.json" \
               "$API/actions/runs/$RUN_ID/jobs?per_page=100&page=$page"; then
              emit "jobs-endpoint" "http failed for run $RUN_ID page $page"
              break
            fi
            # ":" is inside the payload's own values, so the pair is joined with a
            # separator the log names cannot contain, and spaces are underscored.
            failed="$failed $(jq -r '.jobs[]
              | select(.conclusion != "success" and .conclusion != "skipped")
              | "\(.id)=\(.name)"' "$RUNNER_TEMP/jobs-p$page.json" | tr ' ' '_')"
            n=$(jq '.jobs | length' "$RUNNER_TEMP/jobs-p$page.json")
            [ "${n:-0}" -lt 100 ] && break
            page=$((page + 1))
          done

          if [ -z "${failed// /}" ]; then
            emit "no-failed-job" "run $RUN_ID concluded $CONCLUSION but no job had a failing conclusion"
            exit 0
          fi

          census=""
          seen=0
          for spec in $failed; do
            job_id="${spec%%=*}"
            job_name="${spec#*=}"
            log="$RUNNER_TEMP/job-$job_id.log"
            seen=$((seen + 1))
            emit "failed-job" "$job_name id=$job_id"

            code=$(curl -sS -o "$log" -w '%{http_code}' -L \
              -H "$auth" -H "Accept: application/vnd.github+json" \
              "$API/actions/jobs/$job_id/logs" || echo 000)
            size=$(wc -c < "$log" 2>/dev/null || echo 0)
            emit "log-http" "$job_name http=$code bytes=$size"
            [ "$code" = "200" ] && [ "$size" -gt 0 ] || continue

            # Annotation budget: a check run holds only a limited number, so the test
            # NAMES get the largest share and the per-job total stays
            # 1 + 1 + 2 + 12 + 3 + 2 = 21 even when every leg of the run is red.
            emit_grep "aggregate" 2 "$log" "$AGG_RE"
            emit_grep "failing" 12 "$log" "$NAMES_RE"
            emit_grep "why" 3 "$log" "$WHY_RE"
            # The tail is where an unhandled worker death leaves its trace.
            emit_tail "tail" 2 "$log"
          done

          # Self-reporting, because `named=0` is the difference between "this shape is
          # unknown" and "the token could not read the log" — and exit 0 on purpose: the
          # run being reported on is already red, and a second red workflow on top of it
          # buries the reading this job exists to produce.
          emit "census" "failed_jobs=$seen$census"
          exit 0
