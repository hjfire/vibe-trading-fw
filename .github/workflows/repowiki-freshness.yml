name: repowiki-freshness

# Fork-owned. Nothing upstream ever ran tools/test_wiki_drift.py
# (pyproject.toml's testpaths is "agent/tests"), and this repository's rule is that
# upstream files stay byte-for-byte alone — so the fork adds a file rather than
# editing .github/workflows/test.yml.
#
# 控制器裁定（写进计划，不许执行者自己翻案）：套件步骤是硬步骤，它第一天就该绿，
# 所以那一步不配任何容错开关；只有水位门禁那一步是软的（spec §9.1 给的观察窗口是两周，
# 「首周只观察、再改阻断」是把两周收小的 Task 5 裁定，见计划 :832）。
# 因此全文件里那个容错开关只允许出现一行 —— tools/test_wiki_drift.py 的
# test_the_fork_workflow_collects_the_suite_and_only_softens_the_water_level 就是钉这一行的，
# 两步都软等于一个从不报警的绿灯。

on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-repowiki-freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth 必须是 0：默认浅克隆只取 HEAD，而 `stale` 要数每页 frontmatter 里
      # 那个 verified_at commit 之后有多少提交。历史不够时它打印的是空字节，门禁的整数
      # 守卫随即 exit 1 —— 那读起来像 wiki 出了问题，实际只是克隆太浅。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # `stale` needs every page's verified_at commit reachable
      # 控制器裁定 P-9：套件里两条守卫读 upstream/main —— changed_vs_upstream()
      # （tools/test_wiki_drift.py:2658）跑 `git diff --name-only upstream/main...HEAD`，
      # 读不到就 raise，那是它的设计：一个读不到东西的检查必须失败，绝不 skip。
      # actions/checkout 只配 origin，refs/remotes/upstream/* 永远不会自己出现，所以这一步
      # 要在任何读写历史的步骤之前把 ref 落盘。形状照抄本仓已有的 **fork 自有**先例
      # `.github/workflows/sync-upstream.yml`（它同样是 fork 独有、不在 UPSTREAM_OWNED 的
      # 上游归属表里 —— 别把它读成上游文件）：git remote add 会记下标准 refspec，故
      # git fetch upstream 就产出该跟踪 ref；公开仓、匿名 HTTPS，所以 permissions 保持
      # contents: read，这一步不需要 SYNC_TOKEN。本地实测 upstream/main 是 HEAD 的**严格
      # 祖先**（落后 0，判据是 `git merge-base --is-ancestor upstream/main HEAD`），而领先
      # 多少条是**时点读数** —— 本文件每落一次库它自己就 +1，所以这里不写数字；要核对就在
      # 跑这条工作流的那个 commit 上重跑 rev-list --left-right --count。上一步已取全量历史
      # ⇒ 这一步只做 ref 协商，几乎不传字节。
      # 这一步是硬的：它红 = 够不到上游，而步骤名本身就是诊断。
      # 已知残留风险（只有真实 runner 能证伪）：checkout 默认会把临时凭证写进全局 git 配置
      # http.https://github.com/.extraheader，同 host 的这一步会带上它。公开仓对任意已认证
      # 账户可读，预期无害；若首红就在这一行，改法是给上面的 checkout 加一行
      # `persist-credentials: false`（本 job 不写任何 git 状态，没人需要那颗 header），
      # 而不是给这一步加容错开关或给那两条守卫打标记摘出 CI。
      - name: Materialise upstream/main for the fork-hygiene guards
        run: |
          git remote add upstream https://github.com/HKUDS/Vibe-Trading.git
          git fetch upstream
          git rev-parse --verify refs/remotes/upstream/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # 只装 pytest：这套守卫按设计只依赖标准库 + pytest，不引入任何新的第三方依赖。
      - name: Install pytest only
        run: python -m pip install --upgrade pytest
      # 水位门禁（软）。阈值不留任何 padding：门禁现在对非整数取值 fail-closed，多一个
      # 空格也算拼错的旋钮，直接 exit 1 而不是静默常绿。
      # 用 `bash tools/...` 而不是 `./tools/...`：本仓 core.filemode=false，执行位没有记
      # 进 git（对象是 100644），带 ./ 的写法在 runner 上会 Permission denied。
      - name: Wiki freshness gate
        continue-on-error: true
        env:
          WIKI_STALE_MAX: '445'
        run: bash tools/wiki_freshness_gate.sh
      # 套件（硬）。带 local_archive 标记的是**三条**用例（这个数是形状，不是水位；选择器的
      # 读数按「在某 commit 实测」写）：前两条断言未入库的
      # .qoder/repowiki/_ide-export-retired-2026-10-01 仍在位，全新检出里必然红；第三条断言
      # 导出的正文树**不在**该容器里，没有容器时它自己 skip —— 摘掉它们的理由不是「怕它们
      # 报警」，而是它们在 CI 既没有归档也没有容器、读数与本地不同源。标记注册在
      # tools/conftest.py。门禁与工具在 CI 里始终只读 —— 本文件没有任何步骤写 INDEX.md，
      # 也没有任何步骤提交产物。
      - name: Wiki guard suite
        run: python -X utf8 -m pytest tools/test_wiki_drift.py -q -m "not local_archive"
